apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: nodepools.hyperfleet.io
spec:
  group: hyperfleet.io
  names:
    kind: NodePool
    listKind: NodePoolList
    plural: nodepools
    shortNames:
      - hfnp
    singular: nodepool
  scope: Namespaced
  versions:
    - additionalPrinterColumns:
        - jsonPath: .status.phase
          name: Phase
          type: string
        - jsonPath: .metadata.creationTimestamp
          name: Age
          type: date
      name: v1alpha1
      schema:
        openAPIV3Schema:
          description: |-
            NodePool is the Schema for the nodepools API.
            It represents a set of worker nodes for a Cluster.
            The parent Cluster shares the same metadata.Namespace (cluster UUID).
          properties:
            apiVersion:
              description: |-
                APIVersion defines the versioned schema of this representation of an object.
                Servers should convert recognized schemas to the latest internal value, and
                may reject unrecognized values.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
              type: string
            kind:
              description: |-
                Kind is a string value representing the REST resource this object represents.
                Servers may infer this from the endpoint the client submits requests to.
                Cannot be updated.
                In CamelCase.
                More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
              type: string
            metadata:
              type: object
            spec:
              description: |-
                NodePoolSpec defines the desired state of a NodePool.
                The parent Cluster is identified by the shared metadata.Namespace (cluster UUID).
              properties:
                accountId:
                  description: AccountID is the AWS account that owns this node pool.
                  type: string
                autoRepair:
                  description: AutoRepair controls whether unhealthy nodes are automatically replaced.
                  type: boolean
                displayName:
                  description: DisplayName is a human-readable name for the node pool.
                  maxLength: 256
                  type: string
                internalPoolId:
                  description: InternalPoolID is a platform-assigned unique identifier.
                  type: string
                labels:
                  additionalProperties:
                    type: string
                  description: Labels are customer-defined labels applied to nodes in this pool.
                  maxProperties: 100
                  type: object
                nodePool:
                  description: |-
                    NodePool contains the upstream HyperShift fields, mirrored as
                    passthrough types with per-field visibility and write-mode markers.
                  properties:
                    arch:
                      description: arch is the preferred processor architecture for the NodePool. Different platforms might have different supported architectures.
                      type: string
                    autoScaling:
                      description: autoScaling specifies auto-scaling behavior for the NodePool.
                      properties:
                        max:
                          description: max is the maximum number of nodes allowed in the pool. Must be >= 1 and >= Min.
                          format: int32
                          minimum: 1
                          type: integer
                        min:
                          description: |-
                            min is the minimum number of nodes to maintain in the pool.
                            Can be set to 0 for scale-from-zero for AWS platform.
                            Must be >= 0 and <= .Max.
                          format: int32
                          minimum: 0
                          type: integer
                      required:
                        - max
                        - min
                      type: object
                    clusterName:
                      description: clusterName is the name of the HostedCluster this NodePool belongs to.
                      type: string
                    config:
                      description: config is a list of references to ConfigMaps containing serialized
                      items:
                        description: |-
                          LocalObjectReference contains enough information to let you locate the
                          referenced object inside the same namespace.
                        properties:
                          name:
                            default: ""
                            description: |-
                              Name of the referent.
                              This field is effectively required, but due to backwards compatibility is
                              allowed to be empty. Instances of this type with an empty value here are
                              almost certainly wrong.
                              More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                            type: string
                        type: object
                        x-kubernetes-map-type: atomic
                      type: array
                    management:
                      description: management specifies behavior for managing nodes in the pool, such as
                      properties:
                        autoRepair:
                          default: false
                          description: |-
                            autoRepair specifies whether health checks should be enabled for machines in the NodePool. The default is false.
                            Enabling this feature will cause the controller to automatically delete unhealthy machines.
                            The unhealthy criteria is reserved for the controller implementation and subject to change.
                            But generally it's determined by checking the Node ready condition is true and a timeout that might vary depending on the platform provider.
                            AutoRepair will no-op when more than 2 Nodes are unhealthy at the same time. Giving time for the cluster to stabilize or to the user to manually intervene.
                          type: boolean
                        inPlace:
                          description: inPlace is the configuration for in-place upgrades.
                          properties:
                            maxUnavailable:
                              anyOf:
                                - type: integer
                                - type: string
                              description: |-
                                maxUnavailable is the maximum number of nodes that can be unavailable
                                during the update.

                                Value can be an absolute number (ex: 5) or a percentage of desired nodes
                                (ex: 10%).

                                Absolute number is calculated from percentage by rounding down.

                                Defaults to 1.

                                Example: when this is set to 30%, a max of 30% of the nodes can be made
                                unschedulable/unavailable immediately when the update starts. Once a set
                                of nodes is updated, more nodes can be made unschedulable for update,
                                ensuring that the total number of nodes schedulable at all times during
                                the update is at least 70% of desired nodes.
                              x-kubernetes-int-or-string: true
                          type: object
                        replace:
                          default:
                            rollingUpdate:
                              maxSurge: 1
                              maxUnavailable: 0
                            strategy: RollingUpdate
                          description: |-
                            replace is the configuration for rolling upgrades.
                            It defaults to a RollingUpdate strategy with maxSurge of 1 and maxUnavailable of 0.
                          properties:
                            rollingUpdate:
                              description: |-
                                rollingUpdate specifies a rolling update strategy which upgrades nodes by
                                creating new nodes and deleting the old ones.
                              properties:
                                maxSurge:
                                  anyOf:
                                    - type: integer
                                    - type: string
                                  description: |-
                                    maxSurge is the maximum number of nodes that can be provisioned above the
                                    desired number of nodes.

                                    Value can be an absolute number (ex: 5) or a percentage of desired nodes
                                    (ex: 10%).

                                    Absolute number is calculated from percentage by rounding up.

                                    This can not be 0 if MaxUnavailable is 0.

                                    Defaults to 1.

                                    Example: when this is set to 30%, new nodes can be provisioned immediately
                                    when the rolling update starts, such that the total number of old and new
                                    nodes do not exceed 130% of desired nodes. Once old nodes have been
                                    deleted, new nodes can be provisioned, ensuring that total number of nodes
                                    running at any time during the update is at most 130% of desired nodes.
                                  x-kubernetes-int-or-string: true
                                maxUnavailable:
                                  anyOf:
                                    - type: integer
                                    - type: string
                                  description: |-
                                    maxUnavailable is the maximum number of nodes that can be unavailable
                                    during the update.

                                    Value can be an absolute number (ex: 5) or a percentage of desired nodes
                                    (ex: 10%).

                                    Absolute number is calculated from percentage by rounding down.

                                    This can not be 0 if MaxSurge is 0.

                                    Defaults to 0.

                                    Example: when this is set to 30%, old nodes can be deleted down to 70% of
                                    desired nodes immediately when the rolling update starts. Once new nodes
                                    are ready, more old nodes be deleted, followed by provisioning new nodes,
                                    ensuring that the total number of nodes available at all times during the
                                    update is at least 70% of desired nodes.
                                  x-kubernetes-int-or-string: true
                              type: object
                            strategy:
                              description: |-
                                strategy is the node replacement strategy for nodes in the pool.
                                In can be either "RollingUpdate" or "OnDelete". RollingUpdate will rollout Nodes honoring maxSurge and maxUnavailable.
                                OnDelete provide more granular control and will replace nodes as the old ones are manually deleted.
                              enum:
                                - RollingUpdate
                                - OnDelete
                              type: string
                          type: object
                        upgradeType:
                          description: |-
                            upgradeType specifies the type of strategy for handling upgrades.
                            This can be either "Replace" or "InPlace".
                            "Replace" will update Nodes by recreating the underlying instances.
                            "InPlace" will update Nodes by applying changes to the existing instances. This might or might not result in a reboot.
                          enum:
                            - Replace
                            - InPlace
                          type: string
                      required:
                        - upgradeType
                      type: object
                    nodeDrainTimeout:
                      description: nodeDrainTimeout is the maximum amount of time that the controller will spend on retrying to drain a node until it succeeds.
                      type: string
                    nodeLabels:
                      additionalProperties:
                        type: string
                      description: nodeLabels propagates a list of labels to Nodes, only once on creation.
                      type: object
                    nodeVolumeDetachTimeout:
                      description: nodeVolumeDetachTimeout is the maximum amount of time that the controller will spend on detaching volumes from a node.
                      type: string
                    osImageStream:
                      description: osImageStream specifies an OS stream to be used for nodes in this pool.
                      properties:
                        name:
                          description: name is a required reference to an OSImageStream to be used for the pool.
                          enum:
                            - rhel-9
                            - rhel-10
                          type: string
                      required:
                        - name
                      type: object
                    pausedUntil:
                      description: pausedUntil is a field that can be used to pause reconciliation on the NodePool controller. Resulting in any change to the NodePool being ignored.
                      type: string
                    platform:
                      description: platform specifies the underlying infrastructure provider for the NodePool
                      properties:
                        aws:
                          description: aws specifies the platform-specific AWS configuration for this NodePool.
                          properties:
                            ami:
                              description: |-
                                ami is the image id to use for node instances. If unspecified, the default
                                is chosen based on the NodePool release payload image.
                              maxLength: 255
                              type: string
                            imageType:
                              description: |-
                                imageType specifies the type of image to use for node instances.
                                Valid values are "Linux" or "Windows"
                                When set to Windows, the controller will automatically populate the AMI field
                                with a Windows-compatible AMI based on the region and OpenShift version.
                                When the AMI field is also set, it will take precedence over automatic selection based
                                on imageType. Also note that Windows ImageType is only compatible with an Arch of amd64
                              enum:
                                - Windows
                                - Linux
                              type: string
                            instanceProfile:
                              description: instanceProfile is the AWS EC2 instance profile, which is a container for an IAM role that the EC2 instance uses.
                              maxLength: 255
                              type: string
                            instanceType:
                              description: instanceType is an ec2 instance type for node instances (e.g. m5.large).
                              maxLength: 255
                              type: string
                            placement:
                              description: placement specifies the placement options for the EC2 instances.
                              properties:
                                capacityReservation:
                                  description: |-
                                    capacityReservation specifies Capacity Reservation options for the NodePool instances.

                                    Cannot be specified when tenancy is set to "host" as Dedicated Hosts
                                    do not support Capacity Reservations. Compatible with "default" and "dedicated" tenancy.

                                    Required when marketType is "CapacityBlocks".
                                  properties:
                                    id:
                                      description: |-
                                        id specifies the target Capacity Reservation into which the EC2 instances should be launched.
                                        Must follow the format: cr- followed by 17 lowercase hexadecimal characters. For example: cr-0123456789abcdef0
                                        When empty, no specific Capacity Reservation is targeted.

                                        When specified, preference cannot be set to 'None' or 'Open' as these
                                        are mutually exclusive with targeting a specific reservation. Use preference 'CapacityReservationsOnly'
                                        or omit preference field when targeting a specific reservation.
                                      maxLength: 20
                                      type: string
                                    marketType:
                                      description: |-
                                        marketType specifies the market type of the CapacityReservation for the EC2 instances.

                                        Deprecated: Use placement.marketType instead. This field is maintained for backward compatibility.
                                        When both placement.marketType and capacityReservation.marketType are set, placement.marketType takes precedence.

                                        Valid values are OnDemand, CapacityBlocks and omitted:
                                        - "OnDemand": EC2 instances run as standard On-Demand instances.
                                        - "CapacityBlocks": scheduled pre-purchased compute capacity. Recommended for GPU/ML workloads.

                                        When set to 'CapacityBlocks', a specific Capacity Reservation ID must be provided.
                                      enum:
                                        - OnDemand
                                        - CapacityBlocks
                                      type: string
                                    preference:
                                      description: |-
                                        preference specifies the preference for use of Capacity Reservations by the instance. Valid values include:
                                        - "": No preference (platform default)
                                        - "Open": The instance may make use of open Capacity Reservations that match its AZ and InstanceType
                                        - "None": The instance may not make use of any Capacity Reservations. This is to conserve open reservations for desired workloads
                                        - "CapacityReservationsOnly": The instance will only run if matched or targeted to a Capacity Reservation

                                        Cannot be set to 'None' or 'Open' when a specific Capacity Reservation ID is provided,
                                        as targeting a specific reservation is mutually exclusive with these general preference settings.
                                      enum:
                                        - ""
                                        - None
                                        - CapacityReservationsOnly
                                        - Open
                                      type: string
                                  type: object
                                marketType:
                                  description: |-
                                    marketType specifies the EC2 instance purchasing model.
                                    Supported values are "OnDemand" for standard on-demand instances,
                                    "Spot" for spot instances that use spare EC2 capacity at reduced prices
                                    but may be interrupted (optionally accepts spot options and requires
                                    terminationHandlerQueueURL on the HostedCluster), and "CapacityBlocks" for scheduled pre-purchased
                                    compute capacity recommended for GPU/ML workloads (requires
                                    capacityReservation with a specific reservation ID).
                                    When omitted, the default is "OnDemand".
                                  enum:
                                    - ""
                                    - OnDemand
                                    - Spot
                                    - CapacityBlocks
                                  type: string
                                spot:
                                  description: |-
                                    spot configures optional Spot instance overrides.
                                    When omitted, Spot instances use AWS defaults.

                                    Spot instances use spare EC2 capacity at reduced prices but may be interrupted
                                    with a 2-minute warning. Requires terminationHandlerQueueURL to be set on the
                                    HostedCluster's AWS platform spec for graceful handling of interruptions.
                                  properties:
                                    maxPrice:
                                      description: |-
                                        maxPrice defines the maximum price the user is willing to pay for Spot instances.
                                        If not specified, the on-demand price is used as the maximum (you pay the actual spot price).
                                        The value should be a decimal number representing the price per hour in USD.
                                        For example, "0.50" means 50 cents per hour.

                                        Note: AWS recommends NOT setting maxPrice to reduce interruption frequency.
                                        When omitted, you pay the current Spot price (capped at On-Demand price).
                                        AWS minimum allowed value is $0.001.
                                      maxLength: 20
                                      minLength: 1
                                      pattern: ^[0-9]+(\.[0-9]+)?$
                                      type: string
                                  type: object
                                tenancy:
                                  description: |-
                                    tenancy indicates if instance should run on shared or single-tenant hardware.

                                    Possible values:
                                    - "default": NodePool instances run on shared hardware.
                                    - "dedicated": Each NodePool instance runs on single-tenant hardware (Dedicated Instances).
                                    - "host": NodePool instances run on user's pre-allocated dedicated hosts (Dedicated Hosts).

                                    When tenancy is set to "host", capacityReservation cannot be specified
                                    as AWS does not support Capacity Reservations with Dedicated Hosts.
                                  enum:
                                    - default
                                    - dedicated
                                    - host
                                  type: string
                              type: object
                            resourceTags:
                              description: |-
                                resourceTags is an optional list of additional tags to apply to AWS node
                                instances. Changes to this field will be propagated in-place to AWS EC2 instances and their initial EBS volumes.
                                Volumes created by the storage operator and attached to instances after they are created do not get these tags applied.

                                These will be merged with HostedCluster scoped tags, which take precedence in case of conflicts.
                                These take precedence over tags defined out of band (i.e., tags added manually or by other tools outside of HyperShift) in AWS in case of conflicts.

                                See https://docs.aws.amazon.com/general/latest/gr/aws_tagging.html for
                                information on tagging AWS resources. AWS supports a maximum of 50 tags per
                                resource. OpenShift reserves 25 tags for its use, leaving 25 tags available
                                for the user.
                              items:
                                description: AWSResourceTag is a tag to apply to AWS resources created for the cluster.
                                properties:
                                  key:
                                    description: key is the key of the tag.
                                    maxLength: 128
                                    minLength: 1
                                    pattern: ^[0-9A-Za-z_.:/=+-@]+$
                                    type: string
                                  value:
                                    description: |-
                                      value is the value of the tag.

                                      Some AWS service do not support empty values. Since tags are added to
                                      resources in many services, the length of the tag value must meet the
                                      requirements of all services.
                                    maxLength: 256
                                    minLength: 1
                                    pattern: ^[0-9A-Za-z_.:/=+-@]+$
                                    type: string
                                required:
                                  - key
                                  - value
                                type: object
                              maxItems: 25
                              type: array
                            rootVolume:
                              description: rootVolume specifies configuration for the root volume of node instances.
                              properties:
                                encrypted:
                                  description: encrypted indicates whether the EBS volume should be encrypted or not.
                                  type: boolean
                                encryptionKey:
                                  description: encryptionKey is the KMS key to use for volume encryption.
                                  maxLength: 2048
                                  type: string
                                iops:
                                  description: |-
                                    iops is the number of IOPS requested for the disk. This is only valid
                                    for type io1.
                                  format: int64
                                  type: integer
                                size:
                                  description: |-
                                    size is the size of the volume in gibibytes (GiB).

                                    Must be greater than the image snapshot size or 8 (whichever is greater).
                                  format: int64
                                  minimum: 8
                                  type: integer
                                type:
                                  description: type is the type of volume to provision.
                                  maxLength: 255
                                  type: string
                              required:
                                - size
                                - type
                              type: object
                            securityGroups:
                              description: |-
                                securityGroups is an optional set of security groups to associate with node
                                instances.
                              items:
                                description: |-
                                  AWSResourceReference is a reference to a specific AWS resource by ID or filters.
                                  Only one of ID or Filters may be specified. Specifying more than one will result in
                                  a validation error.
                                properties:
                                  filters:
                                    description: |-
                                      filters is a set of key/value pairs used to identify a resource
                                      They are applied according to the rules defined by the AWS API:
                                      https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/Using_Filtering.html
                                    items:
                                      description: Filter is a filter used to identify an AWS resource
                                      properties:
                                        name:
                                          description: name is the name of the filter.
                                          maxLength: 255
                                          type: string
                                        values:
                                          description: values is a list of values for the filter.
                                          items:
                                            maxLength: 255
                                            type: string
                                          maxItems: 50
                                          type: array
                                      required:
                                        - name
                                        - values
                                      type: object
                                    maxItems: 50
                                    type: array
                                  id:
                                    description: id of resource
                                    maxLength: 255
                                    type: string
                                type: object
                              maxItems: 50
                              type: array
                            subnet:
                              description: subnet is the subnet to use for node instances.
                              properties:
                                filters:
                                  description: |-
                                    filters is a set of key/value pairs used to identify a resource
                                    They are applied according to the rules defined by the AWS API:
                                    https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/Using_Filtering.html
                                  items:
                                    description: Filter is a filter used to identify an AWS resource
                                    properties:
                                      name:
                                        description: name is the name of the filter.
                                        maxLength: 255
                                        type: string
                                      values:
                                        description: values is a list of values for the filter.
                                        items:
                                          maxLength: 255
                                          type: string
                                        maxItems: 50
                                        type: array
                                    required:
                                      - name
                                      - values
                                    type: object
                                  maxItems: 50
                                  type: array
                                id:
                                  description: id of resource
                                  maxLength: 255
                                  type: string
                              type: object
                          required:
                            - instanceType
                            - subnet
                          type: object
                        type:
                          description: type specifies the platform type for this NodePool.
                          maxLength: 100
                          type: string
                      required:
                        - type
                      type: object
                    release:
                      description: release specifies the OCP release used for this NodePool. It drives the machine ignition configuration (including
                      properties:
                        image:
                          description: |-
                            image is the image pullspec of an OCP release payload image.
                            See https://quay.io/repository/openshift-release-dev/ocp-release?tab=tags for a list of available images.
                          maxLength: 253
                          minLength: 1
                          type: string
                      required:
                        - image
                      type: object
                    replicas:
                      description: replicas is the desired number of nodes the pool should maintain. If unset, the controller default value is 0.
                      format: int32
                      type: integer
                    taints:
                      description: taints if specified, propagates a list of taints to Nodes, only once on creation.
                      items:
                        description: |-
                          taint is as v1 Core but without TimeAdded.
                          https://github.com/kubernetes/kubernetes/blob/ed8cad1e80d096257921908a52ac69cf1f41a098/staging/src/k8s.io/api/core/v1/types.go#L3037-L3053
                          Validation replicates the same validation as the upstream https://github.com/kubernetes/kubernetes/blob/9a2a7537f035969a68e432b4cc276dbce8ce1735/pkg/util/taints/taints.go#L273.
                          See also https://kubernetes.io/docs/concepts/overview/working-with-objects/names/.
                        properties:
                          effect:
                            description: |-
                              effect is the effect of the taint on pods
                              that do not tolerate the taint.
                              Valid effects are NoSchedule, PreferNoSchedule and NoExecute.
                            enum:
                              - NoSchedule
                              - PreferNoSchedule
                              - NoExecute
                            type: string
                          key:
                            description: key is the taint key to be applied to a node.
                            maxLength: 253
                            minLength: 1
                            type: string
                          value:
                            description: value is the taint value corresponding to the taint key.
                            maxLength: 253
                            type: string
                        required:
                          - effect
                          - key
                        type: object
                      type: array
                    tuningConfig:
                      description: tuningConfig is a list of references to ConfigMaps containing serialized
                      items:
                        description: |-
                          LocalObjectReference contains enough information to let you locate the
                          referenced object inside the same namespace.
                        properties:
                          name:
                            default: ""
                            description: |-
                              Name of the referent.
                              This field is effectively required, but due to backwards compatibility is
                              allowed to be empty. Instances of this type with an empty value here are
                              almost certainly wrong.
                              More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                            type: string
                        type: object
                        x-kubernetes-map-type: atomic
                      type: array
                  required:
                    - clusterName
                    - management
                    - platform
                    - release
                  type: object
              required:
                - nodePool
              type: object
            status:
              description: NodePoolStatus defines the observed state of a NodePool.
              properties:
                conditions:
                  description: |-
                    Conditions represent the latest observations of the node pool's state.
                    Known condition types: Synced, Ready.
                  items:
                    description: Condition contains details for one aspect of the current state of this API Resource.
                    properties:
                      lastTransitionTime:
                        description: |-
                          lastTransitionTime is the last time the condition transitioned from one status to another.
                          This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                        format: date-time
                        type: string
                      message:
                        description: |-
                          message is a human readable message indicating details about the transition.
                          This may be an empty string.
                        maxLength: 32768
                        type: string
                      observedGeneration:
                        description: |-
                          observedGeneration represents the .metadata.generation that the condition was set based upon.
                          For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                          with respect to the current state of the instance.
                        format: int64
                        minimum: 0
                        type: integer
                      reason:
                        description: |-
                          reason contains a programmatic identifier indicating the reason for the condition's last transition.
                          Producers of specific condition types may define expected values and meanings for this field,
                          and whether the values are considered a guaranteed API.
                          The value should be a CamelCase string.
                          This field may not be empty.
                        maxLength: 1024
                        minLength: 1
                        pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                        type: string
                      status:
                        description: status of the condition, one of True, False, Unknown.
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                        type: string
                      type:
                        description: type of condition in CamelCase or in foo.example.com/CamelCase.
                        maxLength: 316
                        pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                        type: string
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    type: object
                  type: array
                  x-kubernetes-list-map-keys:
                    - type
                  x-kubernetes-list-type: map
                observedGeneration:
                  description: ObservedGeneration is the most recent generation observed by the controller.
                  format: int64
                  type: integer
                phase:
                  description: Phase summarizes the node pool's lifecycle state.
                  enum:
                    - WaitingForCluster
                    - Provisioning
                    - Ready
                    - Deleting
                  type: string
              type: object
          required:
            - spec
          type: object
      served: true
      storage: true
      subresources:
        status: {}
